[package]
name = "apptop"
version = "0.1.0"
edition = "2021"
description = "App-centric resource monitor for the Linux terminal, with braille icons"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tui", "monitor", "process", "terminal", "linux"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.191"
netlink-packet-core = "0.9.0"
netlink-packet-sock-diag = { version = "0.5", features = ["rich_nlas"] }
netlink-sys = "0.9.0"
nix = { version = "0.32", default-features = false, features = ["user", "signal"] }
procfs = { version = "0.18", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
resvg = { version = "0.50", default-features = false }
toml = { version = "~1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
insta = "1"
libc = "0.2.191"
tempfile = "3.27.0"

[profile.release]
# Binario más chico y algo más rápido. Se conserva el desenrollado de pila
# (panic = "unwind") porque el hook de panic restaura la terminal.
lto = "thin"
codegen-units = 1
strip = true
