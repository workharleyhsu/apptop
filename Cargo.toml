[package]
name = "apptop"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
procfs = { version = "0.18", default-features = false }
resvg = { version = "0.50", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
