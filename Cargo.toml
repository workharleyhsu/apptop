[package]
name = "apptop"
version = "0.1.4"
edition = "2021"
description = "App-centric resource monitor for the Linux terminal, with braille icons"
license = "MIT OR Apache-2.0"
authors = ["HarleyHsu <270751439+workharleyhsu@users.noreply.github.com>"]
repository = "https://github.com/workharleyhsu/apptop"
homepage = "https://github.com/workharleyhsu/apptop"
readme = "README.md"
exclude = ["docs/screenshots/"]
keywords = ["tui", "monitor", "process", "terminal", "linux"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.191"
netlink-packet-core = "0.9.0"
netlink-packet-sock-diag = { version = "0.5", features = ["rich_nlas"] }
netlink-sys = "0.9.0"
nix = { version = "0.32", default-features = false, features = ["user", "signal"] }
procfs = { version = "0.18", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
resvg = { version = "0.50", default-features = false }
toml = { version = "~1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
insta = "1"
libc = "0.2.191"
tempfile = "3.27.0"

# Paquetes .deb y .rpm. Se arman con scripts/package.sh a partir del binario
# estático (musl), por eso no declaran dependencias de bibliotecas.
[package.metadata.deb]
maintainer = "HarleyHsu <270751439+workharleyhsu@users.noreply.github.com>"
section = "utils"
priority = "optional"
# El binario es estático: "$auto" no encuentra bibliotecas y no declara ninguna.
depends = "$auto"
extended-description = """\
apptop shows running applications and services as a grid of braille icons, \
grouping processes by app instead of listing them one by one. Opening an app \
shows its process tree, CPU, memory, disk, GPU and network usage, and lets \
you close, kill, pause or renice it. It does not need root."""
assets = [
    ["target/release/apptop", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/apptop/", "644"],
    ["README.es.md", "usr/share/doc/apptop/", "644"],
    ["LICENSE-MIT", "usr/share/doc/apptop/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/apptop/", "644"],
]

[package.metadata.generate-rpm]
# Binario estático: sin dependencias detectadas automáticamente.
auto-req = "no"
assets = [
    { source = "target/release/apptop", dest = "/usr/bin/apptop", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/apptop/README.md", mode = "644", doc = true },
    { source = "README.es.md", dest = "/usr/share/doc/apptop/README.es.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/apptop/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/apptop/LICENSE-APACHE", mode = "644" },
]

[profile.release]
# Binario más chico y algo más rápido. Se conserva el desenrollado de pila
# (panic = "unwind") porque el hook de panic restaura la terminal.
lto = "thin"
codegen-units = 1
strip = true
